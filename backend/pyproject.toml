[project]
name = "codepredict-dashboard-backend"
version = "0.1.0"
description = "API de limpieza visual e inferencia del proyecto CodePredict AI (usa Ada como motor)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "pandas>=2.2",
    "duckdb>=1.1",
    "scipy>=1.13",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
